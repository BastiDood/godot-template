name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - parallel:
          - name: Install Godot
            uses: chickensoft-games/setup-godot@v2
            with:
              version: 4.7.2
              use-dotnet: false
              include-templates: true
          - name: Install `just` and `gdstyle`
            uses: taiki-e/install-action@v2
            with:
              tool: |
                just@1.59.0
                gdstyle@0.7.0

      - parallel:
          - name: Check Formatting
            run: just fmt
          - name: Run Linters
            run: just lint
          - name: Install addons and import project
            run: just

      - parallel:
          - name: Run Type Checks
            run: just check
          - name: Run Unit Tests
            run: just test
          - name: Export Linux Build
            run: just build-preset Linux
          - name: Export Windows Build
            run: just build-preset "Windows Desktop"
          - name: Export Web Build
            run: just build-preset Web

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
