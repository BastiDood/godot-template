name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - parallel:
          - name: Install Godot
            uses: chickensoft-games/setup-godot@v2
            with:
              version: 4.7.2
              use-dotnet: false
              include-templates: true
          - name: Install `just` and `gdstyle`
            uses: taiki-e/install-action@v2
            with:
              tool: |
                just@1.59.0
                gdstyle@0.7.0

      - parallel:
          - name: Check Formatting
            run: just fmt
          - name: Run Linters
            run: just lint
          - name: Install Addons + Import Project
            run: just

      - parallel:
          - name: Run Type Checks
            run: just check
          - name: Run Unit Tests
            uses: ./.github/actions/test
          - name: Export Linux Build
            uses: ./.github/actions/export
            with:
              preset: Linux
              name: linux
              tarball: true
          - name: Export Windows Build
            uses: ./.github/actions/export
            with:
              preset: Windows Desktop
              name: windows
          - name: Export Web Build
            uses: ./.github/actions/export
            with:
              preset: Web
              name: web
